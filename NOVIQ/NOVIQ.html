<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVIQ</title>
<style>
  :root{
    --bg:#14151a; --panel:#1c1e25; --panel2:#20222b;
    --border:#33364280; --border-strong:#8FA6C4;
    --text:#e7e6ee; --dim:#8a8d9c;
    --blue:#A7C7E7; --lav:#C9B6E4; --mint:#B5EAD7; --peach:#FFDAC1; --err:#FFB3B3;
    --radius:14px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'Söhne','Inter',ui-sans-serif,system-ui,sans-serif;}
  body{display:flex;flex-direction:column;}

  header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--border);
    padding-top:calc(22px + env(safe-area-inset-top,0px));}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
    border:1px solid var(--border-strong);background:linear-gradient(135deg,#A7C7E71a,#C9B6E41a);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);}
  h1{font-size:1.05rem;font-weight:600;letter-spacing:.01em;margin:0;color:var(--blue);}
  .sub{color:var(--dim);font-size:.8rem;margin-top:6px;}

  main{flex:1;overflow-y:auto;padding:20px 14px 10px;max-width:760px;width:100%;margin:0 auto;}
  .msg{display:flex;flex-direction:column;margin-bottom:14px;max-width:82%;}
  .msg.user{margin-left:auto;align-items:flex-end;}
  .msg.assistant{margin-right:auto;align-items:flex-start;}
  .label{font-size:.7rem;color:var(--dim);margin-bottom:4px;padding:0 4px;}
  .bubble{border-radius:var(--radius);padding:11px 15px;line-height:1.5;font-size:.92rem;
    white-space:pre-wrap;word-wrap:break-word;}
  .msg.user .bubble{background:linear-gradient(135deg,#A7C7E733,#A7C7E71a);border:1px solid #A7C7E766;border-bottom-right-radius:4px;}
  .msg.assistant .bubble{background:var(--panel);border:1px solid #C9B6E455;border-bottom-left-radius:4px;}
  .msg.error .bubble{background:#FFB3B31a;border:1px solid #FFB3B366;color:var(--err);}

  .typing{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--lav);opacity:.5;animation:pulse 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}

  .empty{color:var(--dim);text-align:center;margin-top:18%;font-size:.9rem;}

  #composer{display:flex;gap:10px;padding:14px;max-width:760px;width:100%;margin:0 auto;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
  input[type=text]{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;color:var(--text);font-size:16px;outline:none;}
  input[type=text]:focus{border-color:var(--border-strong);}
  button{background:linear-gradient(135deg,var(--blue),var(--lav));border:none;border-radius:12px;
    padding:0 20px;color:#14151a;font-weight:600;font-size:.88rem;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--dim);font-weight:500;}

  .toolbar{display:flex;justify-content:center;gap:8px;padding:0 14px 8px;max-width:760px;width:100%;margin:0 auto;}
  .toolbar button{padding:6px 14px;font-size:.78rem;}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);border-radius:16px;
    padding:24px;width:min(440px,92vw);max-height:85vh;overflow-y:auto;}
  dialog::backdrop{background:#000a;}
  dialog h2{margin:0 0 18px;font-size:1.05rem;color:var(--lav);}
  #settingsForm{display:flex;flex-direction:column;}
  dialog label{display:block;font-size:.8rem;color:var(--dim);margin:14px 0 6px;}
  dialog input,dialog select{display:block;width:100%;background:var(--panel2);border:1px solid var(--border);
    border-radius:10px;padding:12px 12px;color:var(--text);font-size:16px;}
  .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .hint{font-size:.74rem;color:var(--dim);margin-top:5px;}

  @media (prefers-color-scheme: light){
    :root{ --bg:#faf9fc; --panel:#fff; --panel2:#f2f1f7; --text:#232433; --dim:#767a8c; --border:#00000014; }
  }
</style>
</head>
<body>

<header>
  <div class="badge"><span class="dot"></span><h1>NOVIQ</h1></div>
  <div class="sub" id="subtitle">not configured · click settings to begin</div>
</header>

<div class="toolbar">
  <button class="ghost" id="settingsBtn">⚙ settings</button>
  <button class="ghost" id="resetBtn">↺ reset</button>
</div>

<main id="chat">
  <div class="empty" id="emptyState">Configure your endpoint, then say hello.</div>
</main>

<form id="composer">
  <input type="text" id="input" placeholder="Type your message…" autocomplete="off" disabled>
  <button type="submit" id="sendBtn" disabled>Send</button>
</form>

<dialog id="settingsDialog">
  <h2>Connection settings</h2>
  <form id="settingsForm" method="dialog">
    <label for="baseUrl">Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://api.example.com" required>

    <label for="apiKey">API key</label>
    <input type="text" id="apiKey" placeholder="sk-…" required>
    <div class="hint">Kept in memory for this session only — never saved to disk.</div>

    <label for="model">Model</label>
    <input type="text" id="model" placeholder="gpt-4.1-nano" required>

    <label for="agentName">Agent name</label>
    <input type="text" id="agentName" placeholder="e.g. Nova">
    <div class="hint">Saved permanently on this device. The agent will identify itself by this name.</div>

    <label for="format">Format</label>
    <select id="format">
      <option value="openai">OpenAI-compatible (/chat/completions)</option>
      <option value="anthropic">Anthropic (/v1/messages)</option>
    </select>

    <div class="dialog-actions">
      <button type="button" class="ghost" id="cancelSettings">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<script>
let history = [];
let config = { baseUrl:"", apiKey:"", model:"", format:"openai", agentName:"" };
let configured = false;

const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const subtitle = document.getElementById('subtitle');
const dialog = document.getElementById('settingsDialog');

function loadSavedSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem('agentSettings') || '{}');
    if(saved.baseUrl) document.getElementById('baseUrl').value = saved.baseUrl;
    if(saved.model) document.getElementById('model').value = saved.model;
    if(saved.format) document.getElementById('format').value = saved.format;
    if(saved.agentName) document.getElementById('agentName').value = saved.agentName;
  }catch(e){ /* ignore corrupt storage */ }
}
function saveSettings(){
  try{
    localStorage.setItem('agentSettings', JSON.stringify({
      baseUrl: config.baseUrl, model: config.model, format: config.format, agentName: config.agentName
    }));
  }catch(e){ /* storage unavailable, skip persistence */ }
}

document.getElementById('settingsBtn').onclick = () => dialog.showModal();
document.getElementById('cancelSettings').onclick = () => dialog.close();

document.getElementById('settingsForm').addEventListener('submit', (e) => {
  config.baseUrl   = document.getElementById('baseUrl').value.trim().replace(/\/$/,'');
  config.apiKey    = document.getElementById('apiKey').value.trim();
  config.model     = document.getElementById('model').value.trim();
  config.format    = document.getElementById('format').value;
  config.agentName = document.getElementById('agentName').value.trim();
  configured = true;
  saveSettings();
  input.disabled = false; sendBtn.disabled = false;
  subtitle.textContent = config.agentName ? `${config.agentName} · ${config.format} · ${config.model}` : `${config.format} · ${config.model}`;
  input.focus();
});

loadSavedSettings();

document.getElementById('resetBtn').onclick = () => {
  history = [];
  chat.innerHTML = '';
  chat.appendChild(emptyState);
  emptyState.style.display = 'block';
};

function addMessage(role, text){
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'you' : role === 'assistant' ? 'agent' : 'error';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(label); wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant'; wrap.id = 'typingIndicator';
  wrap.innerHTML = `<div class="label">agent</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){ document.getElementById('typingIndicator')?.remove(); }

function systemPrompt(){
  return config.agentName
    ? `Your name is ${config.agentName}. Whenever the user asks your name (or something like "who are you"), reply that your name is ${config.agentName}.`
    : "";
}

async function callOpenAI(){
  const msgs = systemPrompt() ? [{ role:'system', content: systemPrompt() }, ...history] : history;
  const res = await fetch(config.baseUrl + '/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},
    body: JSON.stringify({ model: config.model, messages: msgs })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(`HTTP ${res.status}: ${JSON.stringify(data).slice(0,300)}`);
  const content = data?.choices?.[0]?.message?.content;
  if(content == null) throw new Error('Unexpected response shape: ' + JSON.stringify(data).slice(0,300));
  return content || '(empty response)';
}

async function callAnthropic(){
  const body = { model: config.model, max_tokens: 1024, messages: history };
  if(systemPrompt()) body.system = systemPrompt();
  const res = await fetch(config.baseUrl + '/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':config.apiKey,'anthropic-version':'2023-06-01'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(`HTTP ${res.status}: ${JSON.stringify(data).slice(0,300)}`);
  const blocks = data?.content || [];
  const text = blocks.map(b => b.text || '').join('\n');
  if(!blocks.length) throw new Error('Unexpected response shape: ' + JSON.stringify(data).slice(0,300));
  return text || '(empty response)';
}

document.getElementById('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!configured) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addMessage('user', text);
  history.push({ role:'user', content:text });

  sendBtn.disabled = true; input.disabled = true;
  addTyping();
  try{
    const reply = config.format === 'anthropic' ? await callAnthropic() : await callOpenAI();
    removeTyping();
    addMessage('assistant', reply);
    history.push({ role:'assistant', content:reply });
  }catch(err){
    removeTyping();
    addMessage('error', err.message || String(err));
    history.pop();
  }finally{
    sendBtn.disabled = false; input.disabled = false; input.focus();
  }
});

dialog.showModal();
</script>
</body>
</html>
